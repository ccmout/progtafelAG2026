        "graphics",
        "stats",
        "utils",
        "rootSolve"
      ],
      "Suggests": [
        "ExactData"
      ],
      "Additional_repositories": "https://pcalhoun1.github.io/drat",
      "NeedsCompilation": "no",
      "Repository": "CRAN"
    },
